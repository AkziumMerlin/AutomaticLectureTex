course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        # Direct VK Video URLs are passed through to yt-dlp unchanged.
        # `youtube` is the current legacy name of the generic yt-dlp-backed source type.
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  # Restore the original connected-transcript baseline. GigaAM remains available as an optional
  # backend, but its current VAD chunking is intentionally not part of the production lecture path.
  backend: faster_whisper
  model: large-v3
  aligner_model: null
  language: ru
  dtype: float16
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  # The linear pipeline does not run a mathematical rewrite validator. Cross-chunk lecturer
  # corrections are handled by explicit provenance-safe patches instead.
  math_audit: false

notes:
  architecture: linear
  # One chronological note-writing call per chunk. No observation graph, episode graph, hierarchy
  # synthesis, formula gate or validation tree is used.
  chunk_target_seconds: 240
  chunk_overlap_seconds: 0
  visual_rule_selector: true
  visual_llm_selector: true
  visual_dedupe_seconds: 8
  max_low_confidence_visual_requests: 1

  # Mutable local tail: the current chunk can patch a recently written block only when the lecturer
  # explicitly corrects it in CURRENT transcript evidence.
  linear_recent_blocks: 8
  linear_previous_transcript_segments: 8

  # A narrow second pass scans later chunks only for explicit corrections/retractions of older
  # blocks. It is not a mathematical audit and cannot patch from textbook priors alone.
  linear_correction_scan_enabled: true
  linear_correction_catalog_chars: 320
  linear_patch_apply_threshold: 0.90

vision:
  # Return to the simple raw-frame setup. Robust remote extraction/fallbacks remain enabled in the
  # media layer, but temporal board reconstruction is not required by the production path.
  frame_offsets_seconds: [-3, 2, 7]
  temporal_composite_enabled: false
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3
  math_ocr:
    backend: none
    min_confidence: 0.45

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/functional_analysis_vk
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
