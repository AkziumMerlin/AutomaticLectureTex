course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  # Pre-PR2 production baseline: connected Faster-Whisper transcript with course hotwords.
  backend: faster_whisper
  model: large-v3
  aligner_model: null
  language: ru
  chunk_seconds: 60
  max_new_tokens: 2048
  dtype: bfloat16
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0
  hotwords:
    - функциональный анализ
    - нормированное пространство
    - банахово пространство
    - гильбертово пространство
    - линейный оператор
    - ограниченный оператор
    - непрерывный оператор
    - линейный функционал
    - сопряжённый оператор
    - скалярное произведение
    - норма
    - слабая сходимость
    - сильная сходимость
    - компактность
    - спектр
    - резольвента

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  # This is the same local chunk audit that existed before the knowledge-pipeline refactor.
  math_audit: true
  math_audit_min_equals: 4

notes:
  architecture: linear
  # Literal pre-PR2 chunk geometry and visual-selection policy.
  chunk_target_seconds: 180
  chunk_overlap_seconds: 0
  visual_rule_selector: true
  visual_llm_selector: false
  visual_dedupe_seconds: 8
  max_low_confidence_visual_requests: 1

  # The only addition to the old writer: a separate post-pass for explicit lecturer corrections
  # that can refer to material from an earlier technical chunk.
  linear_correction_scan_enabled: true
  linear_correction_catalog_chars: 320
  linear_patch_apply_threshold: 0.90

vision:
  frame_offsets_seconds: [-3, 2, 7]
  temporal_composite_enabled: false
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3
  math_ocr:
    backend: none
    min_confidence: 0.45

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/functional_analysis_vk
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
