course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  # State-pipeline experiment: Qwen3-ASR with forced alignment for long-form timestamps.
  backend: qwen3
  model: Qwen/Qwen3-ASR-1.7B
  aligner_model: Qwen/Qwen3-ForcedAligner-0.6B
  language: ru
  chunk_seconds: 60
  max_new_tokens: 2048
  dtype: bfloat16
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0
  batch_size: 4
  segment_target_seconds: 20
  hotwords:
    - функциональный анализ
    - нормированное пространство
    - банахово пространство
    - гильбертово пространство
    - линейный оператор
    - ограниченный оператор
    - непрерывный оператор
    - линейный функционал
    - сопряжённый оператор
    - скалярное произведение
    - норма
    - слабая сходимость
    - сильная сходимость
    - компактность
    - спектр
    - резольвента

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  math_audit: true
  math_audit_min_equals: 4

notes:
  architecture: state
  # Fine-grained reconstruction ablation: approximately one local semantic window per 20 seconds.
  # Windows still respect Qwen forced-alignment segment boundaries.
  chunk_target_seconds: 20
  chunk_overlap_seconds: 5
  # One direct board-state channel per semantic window; state timestamps are selected by
  # deterministic visual change rather than fixed uniform sampling.
  visual_chunk_board_scan: true
  visual_rule_selector: false
  visual_llm_selector: false
  visual_dedupe_seconds: 8
  max_low_confidence_visual_requests: 0

  # Keep the experiment to the two core multimodal calls per chunk.
  linear_correction_scan_enabled: false
  linear_correction_catalog_chars: 320
  linear_patch_apply_threshold: 0.90

  # No linear global editor/reconciliation. Final blocks are written only after LectureState,
  # semantic episodes, notation and the global outline have been assembled.
  global_validation: false
  state_section_max_evidence_chars: 14000

vision:
  frame_offsets_seconds: [-3, 2, 7]
  temporal_composite_enabled: false
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 1
  max_workers: 3

  # Probe the video cheaply, then retain only chronologically distinct board states.
  board_auto_crop_enabled: true
  board_crop_tiles: 3
  board_crop_tile_overlap: 0.14
  board_crop_padding_fraction: 0.025
  board_crop_min_area_fraction: 0.16
  board_crop_axis_density: 0.25
  board_crop_color_distance: 0.22
  board_crop_max_luminance: 0.78
  board_crop_min_score: 0.35
  board_crop_max_vlm_images: 5
  board_sampling_mode: change
  board_uniform_samples: 5
  # Probe densely enough that a 20 s window can supply up to five distinct board states.
  board_change_probe_seconds: 4.0
  board_change_threshold: 0.10
  board_change_min_gap_seconds: 2.0
  board_change_max_probe_frames: 48

  # If important mathematical content remains unresolved, keep the source itself in the notes.
  unresolved_board_snapshots_enabled: true
  unresolved_board_min_visual_confidence: 0.30
  unresolved_board_max_per_chunk: 1

  formula_detection:
    # Detect local formula regions before MER; whole-board OCR is deliberately avoided.
    enabled: true
    backend: yolov8
    model_path: ../models/formula/mfd/yolo_v8_ft.pt
    confidence: 0.25
    iou: 0.45
    image_size: 1280
    device: cuda
    max_crops_per_state: 6
    max_crops_per_chunk: 8
    padding_fraction: 0.08
    contact_sheet_enabled: true
    contact_sheet_columns: 2

    # Board-video refinement: register neighboring board states, reject camera cuts, use persistent
    # newly written chalk as a seed, and expand it to the containing mathematical line.
    temporal_proposals_enabled: true
    temporal_min_inlier_ratio: 0.40
    temporal_min_good_matches: 18
    temporal_max_crops_per_state: 2
    temporal_min_new_pixels: 24
    temporal_registration_tolerance_px: 6
    temporal_lookahead_states: 3
    temporal_min_persistence_ratio: 0.65
    temporal_context_min_width_px: 180
    temporal_context_min_height_px: 90
    temporal_context_width_factor: 4.0
    temporal_context_height_factor: 2.5

    # Suppress thick foreground cores (lecturer, hand, board frame) while keeping dense chalk
    # formulas intact. Do not classify foreground by connected-component area.
    stroke_foreground_core_radius_px: 8.0
    stroke_foreground_core_dilate_px: 9
    stroke_border_fraction: 0.012

    # PDF-oriented MFD boxes can span most of a chalkboard. Split tall coarse boxes into
    # line-sized regions before UniMERNet instead of OCR'ing the whole board region.
    line_split_enabled: true
    line_split_min_height_px: 180
    line_split_min_band_height_px: 12
    line_split_max_gap_fraction: 0.035
    line_split_row_density: 0.006
    line_split_column_density: 0.03
    line_split_padding_fraction: 0.10
    line_split_horizontal_close_px: 41
    line_split_vertical_barrier_fraction: 0.55
    line_split_min_panel_width_px: 140
    line_split_max_band_height_px: 220
    line_split_valley_ratio: 0.70
    line_split_horizontal_gap_px: 70

  math_ocr:
    # Uni-MuMER is a Qwen-based HMER model fine-tuned specifically for handwritten mathematical
    # expressions. Crop pixels remain direct evidence for the reconstruction VLM.
    backend: unimumer
    min_confidence: 0.45
    board_scan_enabled: true
    board_scan_max_images: 8
    device: cuda
    unimumer_model: phxember/Uni-MuMER-Qwen3.5-2B
    unimumer_python_path: ../models/formula/unimumer-env/bin/python
    unimumer_max_tokens: 512
    unimumer_temperature: 0.2
    unimumer_top_p: 0.8
    unimumer_load_in_4bit: true
    # Hard allocator cap for the OCR subprocess. Leaves headroom beside the already resident
    # ~33 GiB lecture LLM on a 40 GiB A100.
    unimumer_max_gpu_memory_gib: 5.5

    # Baselines / ablations:
    #   backend: unimernet
    #   unimernet_config_path: ../models/formula/unimernet_base/automatic_lecture_tex.yaml
    #   unimernet_python_path: ../models/formula/unimernet-env/bin/python
    # or reuse the already running multimodal lecture model:
    #   backend: qwen_vlm

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk_20s
  compiler: latexmk
  compile: false

runtime:
  # Reuse normalized audio + Qwen transcript from the baseline run; the changed notes/vision
  # fingerprint still forces semantic-window reconstruction to rerun.
  work_dir: ../work/functional_analysis_vk
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
