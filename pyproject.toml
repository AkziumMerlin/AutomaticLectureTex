[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "automatic-lecture-tex"
version = "0.1.0"
description = "Evidence-driven pipeline for turning recorded lectures into reproducible LaTeX notes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AutomaticLectureTex contributors"}]
dependencies = [
  "openai>=1.60",
  "pydantic>=2.9",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
qwen-asr = [
  "accelerate>=1.2",
  "torch>=2.6",
  "transformers>=5.13.0",
]
whisper = ["faster-whisper>=1.1.0"]
review = ["pymupdf>=1.25"]
dev = ["pytest>=8.3", "ruff>=0.9"]
all = [
  "accelerate>=1.2",
  "torch>=2.6",
  "transformers>=5.13.0",
  "faster-whisper>=1.1.0",
  "pymupdf>=1.25",
]

[project.scripts]
automatic-lecture-tex = "automatic_lecture_tex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automatic_lecture_tex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
