course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        # Direct VK Video URLs are passed through to yt-dlp unchanged.
        # `youtube` is the current legacy name of the generic yt-dlp-backed source type.
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  # GigaAM-v3 is used as the single Russian ASR channel. The pipeline chunks the normalized WAV
  # itself, so this does not require pyannote or a Hugging Face VAD token.
  backend: gigaam
  model: v3_e2e_rnnt
  aligner_model: null
  language: ru
  chunk_seconds: 24
  dtype: float16
  device: cuda
  gigaam_fp16_encoder: true
  gigaam_use_flash: false

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  math_audit: true
  math_audit_min_equals: 4

notes:
  architecture: knowledge
  # Raw ASR is reconstructed semantically inside bounded evidence windows. These are not output
  # sections; overlap gives the reconstructor enough local context across proof/formula boundaries.
  chunk_target_seconds: 240
  chunk_overlap_seconds: 60
  boundary_context_seconds: 90
  knowledge_max_active_claims: 160
  knowledge_recent_observations: 80
  max_outline_sections: 40
  global_validation: true
  global_validation_apply_threshold: 0.90
  visual_rule_selector: true
  # GigaAM does not expose Whisper-style probabilities. Let the bounded selector request frames for
  # exact notation/ASR ambiguity from the transcript instead of relying only on confidence rules.
  visual_llm_selector: true
  visual_dedupe_seconds: 8

vision:
  # VLM receives a temporal-median board reconstruction first, plus these original frames. The
  # median suppresses a moving lecturer while the originals preserve short-lived writing/erasures.
  frame_offsets_seconds: [-3, 2, 7]
  temporal_composite_enabled: true
  temporal_window_seconds: 10
  temporal_sample_period_seconds: 2
  temporal_max_frames: 11
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3
  # Optional independent formula OCR. `mathpix` uses MATHPIX_APP_ID/MATHPIX_APP_KEY; `unimernet`
  # requires a local UniMERNet inference config. Keep disabled until an OCR baseline is selected.
  math_ocr:
    backend: none
    min_confidence: 0.45

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/functional_analysis_vk
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
