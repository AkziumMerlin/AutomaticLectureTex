course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        # Direct VK Video URLs are passed through to yt-dlp unchanged.
        # `youtube` is the current legacy name of the generic yt-dlp-backed source type.
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  backend: faster_whisper
  model: large-v3
  aligner_model: null
  language: ru
  chunk_seconds: 60
  max_new_tokens: 2048
  dtype: bfloat16
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0
  hotwords:
    - функциональный анализ
    - нормированное пространство
    - банахово пространство
    - гильбертово пространство
    - линейный оператор
    - ограниченный оператор
    - непрерывный оператор
    - линейный функционал
    - сопряжённый оператор
    - скалярное произведение
    - норма
    - слабая сходимость
    - сильная сходимость
    - компактность
    - спектр
    - резольвента

# Raw ASR remains immutable in raw_transcript.json. The LLM reconstructs only locally supported
# wording before knowledge extraction. Suspicious spans get a second, independent Qwen3-ASR pass.
transcript_correction:
  enabled: true
  window_seconds: 90
  context_seconds: 30
  max_segments_per_batch: 14
  suspicious_asr_confidence: 0.72
  reconstruction_confidence_threshold: 0.72
  ambiguous_segment_confidence: 0.20
  glossary:
    - комплексный линейный функционал
    - вещественная часть
    - мнимая часть
    - теорема Хана — Банаха
    - теорема Хана-Банаха
    - полунорма
    - сопряжённое пространство
    - слабая топология
    - слабая-* топология
    - слабая звёздная топология
    - каноническое вложение
    - рефлексивное пространство
    - теорема Риса
    - ортогональное дополнение
  fallback_enabled: true
  fallback_context_seconds: 8
  fallback_max_group_seconds: 75
  fallback_asr:
    backend: qwen3
    model: Qwen/Qwen3-ASR-1.7B
    aligner_model: Qwen/Qwen3-ForcedAligner-0.6B
    language: ru
    max_new_tokens: 2048
    batch_size: 2
    segment_target_seconds: 20
    dtype: bfloat16
    device: cuda
    hotwords:
      - функциональный анализ
      - линейный функционал
      - теорема Хана-Банаха
      - полунорма
      - сопряжённое пространство
      - слабая топология
      - теорема Риса

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  math_audit: true
  math_audit_min_equals: 4

notes:
  architecture: knowledge
  # These are evidence windows, not output sections. The overlap prevents a proof/correction
  # from being cut at an arbitrary technical boundary; semantic sections are planned later.
  chunk_target_seconds: 480
  chunk_overlap_seconds: 120
  boundary_context_seconds: 120
  knowledge_max_active_claims: 160
  knowledge_recent_observations: 80
  max_outline_sections: 40
  global_validation: true
  global_validation_apply_threshold: 0.85
  visual_rule_selector: true
  visual_llm_selector: false
  visual_dedupe_seconds: 8

vision:
  frame_offsets_seconds: [-3, 2, 7]
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/functional_analysis_vk
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
