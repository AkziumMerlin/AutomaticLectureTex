course:
  id: multivariable_analysis_2023
  title: Многомерный анализ, интегралы и ряды
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        # A playlist URL is allowed: the YouTube backend resolves its first item via yt-dlp.
        url: https://www.youtube.com/playlist?list=PL4_hYwCyhAvaS4YFFeepXydBopP8d9QNv

asr:
  backend: qwen3
  model: Qwen/Qwen3-ASR-1.7B-hf
  aligner_model: Qwen/Qwen3-ForcedAligner-0.6B-hf
  language: ru
  chunk_seconds: 60
  max_new_tokens: 768
  dtype: bfloat16
  device: cuda
  hotwords:
    - многомерный анализ
    - числовой ряд
    - сходимость
    - абсолютная сходимость
    - условная сходимость
    - последовательность
    - предел
    - интеграл
    - производная
    - функция

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false

notes:
  chunk_target_seconds: 180
  visual_rule_selector: true
  visual_llm_selector: true
  visual_dedupe_seconds: 8

vision:
  frame_offsets_seconds: [-3, 2, 7]
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
