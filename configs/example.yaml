course:
  id: functional_analysis_2026
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        url: https://www.youtube.com/watch?v=REPLACE_ME
    # Local files are supported as well:
    # - id: lecture_02
    #   title: Лекция 2
    #   source:
    #     type: file
    #     path: ../data/lecture_02.mp4

asr:
  backend: faster_whisper
  model: large-v3
  aligner_model: null
  language: ru
  chunk_seconds: 60
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0
  hotwords: []

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  math_audit: true
  math_audit_min_equals: 4

notes:
  chunk_target_seconds: 180
  visual_rule_selector: true
  visual_llm_selector: false
  visual_dedupe_seconds: 8

vision:
  frame_offsets_seconds: [-3, 2, 7]
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_2026
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/functional_analysis_2026
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
