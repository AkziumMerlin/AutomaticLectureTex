course:
  id: functional_analysis_vk
  title: Функциональный анализ
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        url: https://vkvideo.ru/video-206078025_456241291?pl=-206078025_250

asr:
  # OpenRouter speech-to-text. Whisper Large V3 is used instead of Turbo because the
  # transcription endpoint explicitly supports verbose segment/word timestamps for this model.
  backend: openai_compatible
  # base_url / API key are inherited from llm below.
  model: openai/whisper-large-v3
  language: ru
  chunk_seconds: 60
  segment_target_seconds: 20
  transcription_response_format: verbose_json
  timeout_seconds: 120
  extra_body:
    timestamp_granularities:
      - word
  hotwords: []

llm:
  # One OpenRouter text+vision model for semantic reconstruction, graph revision, board VLM,
  # reader projection, discourse planning, block writing and grounding review.
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  compatibility_mode: generic
  reasoning_transport: openrouter
  structured_output_mode: native
  model: deepseek/deepseek-v4.1-flash
  output_language: ru
  temperature: 0.2
  top_p: 0.95
  presence_penalty: 0.0
  max_tokens: 32768
  timeout_seconds: 300
  # Graph revision inherits thinking=true; reader-surface stages override it to false below.
  thinking: true
  reasoning_effort: medium
  math_audit: true
  math_audit_min_equals: 4

notes:
  architecture: state
  # Fine-grained reconstruction ablation: approximately one local semantic window per 20 seconds.
  # Windows still respect timestamped ASR segment boundaries.
  chunk_target_seconds: 20
  chunk_overlap_seconds: 5
  # One direct board-state channel per semantic window; state timestamps are selected by
  # deterministic visual change rather than fixed uniform sampling.
  visual_chunk_board_scan: true
  visual_rule_selector: false
  visual_llm_selector: false
  visual_dedupe_seconds: 8
  max_low_confidence_visual_requests: 0

  # Keep the experiment to the two core multimodal calls per chunk.
  linear_correction_scan_enabled: false
  linear_correction_catalog_chars: 320
  linear_patch_apply_threshold: 0.90

  # No linear global editor/reconciliation. Final blocks are written only after LectureState,
  # semantic episodes, notation and the global outline have been assembled.
  global_validation: false
  state_section_max_evidence_chars: 100000
  # The mutable graph remains the semantic source of truth; final sections are rewritten from
  # canonical graph nodes only (no ASR/OCR/raw frames) by the constrained mathematical writer.
  state_section_assembly: llm
  # Whole-lecture mutable graph revision replaces sequential observation repair / claim compaction.
  state_semantic_backend: mutable_graph
  state_graph_revision_rounds: 3
  state_graph_revision_batch_observations: 24
  state_graph_revision_overlap_observations: 4
  state_graph_revision_frontier_width: 3
  state_graph_revision_catalog_chars: 36000
  state_graph_revision_raw_context_chars: 16000
  state_graph_revision_max_images: 3
  # Use the full LLM completion budget for graph revision. Input overflow is split upstream;
  # output truncation is not evidence that the observation focus itself is too large.
  state_graph_revision_max_tokens: null
  state_repaired_episode_batch_observations: 24
  # ReaderProjection / discourse planning / block writing are deliberately non-thinking and
  # low-temperature. Generic OpenAI-compatible mode ignores Qwen/vLLM-only top_k/min_p controls.
  state_section_writer_thinking: false
  state_section_writer_temperature: 0.2
  state_section_writer_top_p: 0.90
  state_section_writer_top_k: 20
  state_section_writer_min_p: 0.0
  state_section_writer_presence_penalty: 0.0
  state_section_writer_repetition_penalty: 1.0
  # Let the final semantic writer re-read nearby literal evidence instead of treating the first
  # OCR/ASR interpretation as ground truth. This context is writer-only and does not rerun OCR.
  state_section_raw_context_seconds: 90
  state_section_raw_evidence_chars: 16000
  # Resolve observations chronologically. Two future observations are visible only as fixed-lag
  # disambiguation context; the accepted history is immutable.
  state_observation_lookahead: 2
  state_observation_history: 4
  state_observation_max_raw_windows: 2
  state_observation_max_images: 2

vision:
  frame_offsets_seconds: [-3, 2, 7]
  temporal_composite_enabled: false
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 1
  max_workers: 3

  # Probe the video cheaply, then retain only chronologically distinct board states.
  board_auto_crop_enabled: true
  board_crop_tiles: 3
  board_crop_tile_overlap: 0.14
  board_crop_padding_fraction: 0.025
  board_crop_min_area_fraction: 0.16
  board_crop_axis_density: 0.25
  board_crop_color_distance: 0.22
  board_crop_max_luminance: 0.78
  board_crop_min_score: 0.35
  board_crop_max_vlm_images: 5
  board_sampling_mode: change
  board_uniform_samples: 5
  # Probe densely enough that a 20 s window can supply up to five distinct board states.
  board_change_probe_seconds: 4.0
  board_change_threshold: 0.10
  board_change_min_gap_seconds: 2.0
  board_change_max_probe_frames: 48

  # If important mathematical content remains unresolved, keep the source itself in the notes.
  unresolved_board_snapshots_enabled: true
  unresolved_board_min_visual_confidence: 0.30
  unresolved_board_max_per_chunk: 1

  formula_detection:
    # Detect local formula regions before MER; whole-board OCR is deliberately avoided.
    enabled: true
    backend: yolov8
    model_path: ../models/formula/mfd/yolo_v8_ft.pt
    confidence: 0.25
    iou: 0.45
    image_size: 1280
    device: cuda
    max_crops_per_state: 6
    max_crops_per_chunk: 8
    padding_fraction: 0.08
    contact_sheet_enabled: true
    contact_sheet_columns: 2

    # Board-video refinement: register neighboring board states, reject camera cuts, use persistent
    # newly written chalk as a seed, and expand it to the containing mathematical line.
    temporal_proposals_enabled: true
    temporal_min_inlier_ratio: 0.40
    temporal_min_good_matches: 18
    temporal_max_crops_per_state: 2
    temporal_min_new_pixels: 24
    temporal_registration_tolerance_px: 6
    temporal_lookahead_states: 3
    temporal_min_persistence_ratio: 0.65
    temporal_context_min_width_px: 180
    temporal_context_min_height_px: 90
    temporal_context_width_factor: 4.0
    temporal_context_height_factor: 2.5

    # Suppress thick foreground cores (lecturer, hand, board frame) while keeping dense chalk
    # formulas intact. Do not classify foreground by connected-component area.
    stroke_foreground_core_radius_px: 8.0
    stroke_foreground_core_dilate_px: 9
    stroke_border_fraction: 0.012

    # PDF-oriented MFD boxes can span most of a chalkboard. Split tall coarse boxes into
    # line-sized regions before UniMERNet instead of OCR'ing the whole board region.
    line_split_enabled: true
    line_split_min_height_px: 180
    line_split_min_band_height_px: 12
    line_split_max_gap_fraction: 0.035
    line_split_row_density: 0.006
    line_split_column_density: 0.03
    line_split_padding_fraction: 0.10
    line_split_horizontal_close_px: 41
    line_split_vertical_barrier_fraction: 0.55
    line_split_min_panel_width_px: 140
    line_split_max_band_height_px: 220
    line_split_valley_ratio: 0.70
    line_split_horizontal_gap_px: 70

  math_ocr:
    # Formula crops are transcribed by the same multimodal DeepSeek V4.1 Flash endpoint.
    # The host still owns formula detection/cropping and canonical formula injection.
    backend: openai_compatible
    openai_model: deepseek/deepseek-v4.1-flash
    # base_url / API key inherit from llm.
    openai_max_tokens: 512
    min_confidence: 0.45
    board_scan_enabled: true
    board_scan_max_images: 8
    normalize_dark_formula: true
    dark_formula_threshold: 128

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/functional_analysis_vk_20s_openrouter
  compiler: latexmk
  compile: false

runtime:
  # Keep API experiments isolated from the local-vLLM cache tree.
  work_dir: ../work/functional_analysis_vk_openrouter
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
