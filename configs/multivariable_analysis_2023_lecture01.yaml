course:
  id: multivariable_analysis_2023
  title: Многомерный анализ, интегралы и ряды
  language: ru
  lectures:
    - id: lecture_01
      title: Лекция 1
      source:
        type: youtube
        # A playlist URL is allowed: the YouTube backend resolves its first item via yt-dlp.
        url: https://www.youtube.com/playlist?list=PL4_hYwCyhAvaS4YFFeepXydBopP8d9QNv

asr:
  backend: faster_whisper
  model: large-v3
  aligner_model: null
  language: ru
  chunk_seconds: 60
  max_new_tokens: 2048
  dtype: bfloat16
  device: cuda
  whisper_compute_type: float16
  whisper_beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  condition_on_previous_text: true
  hallucination_silence_threshold: 2.0
  hotwords:
    - многомерный анализ
    - числовой ряд
    - сходимость
    - абсолютная сходимость
    - условная сходимость
    - последовательность
    - предел
    - интеграл
    - производная
    - функция

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B-FP8
  output_language: ru
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 300
  thinking: false
  math_audit: true
  math_audit_min_equals: 4

notes:
  chunk_target_seconds: 180
  visual_rule_selector: true
  visual_llm_selector: false
  visual_dedupe_seconds: 8

vision:
  frame_offsets_seconds: [-3, 2, 7]
  youtube_video_format: bestvideo[height<=1080]/best[height<=1080]
  max_requests_per_chunk: 4
  max_workers: 3

literature:
  enabled: false
  directory: ../literature
  retrieval_top_k: 4
  chunk_chars: 1800

latex:
  output_dir: ../tex/multivariable_analysis_2023
  compiler: latexmk
  compile: false

runtime:
  work_dir: ../work/multivariable_analysis_2023
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  yt_dlp: yt-dlp
