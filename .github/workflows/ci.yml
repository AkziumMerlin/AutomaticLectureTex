name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check --ignore E501,I001 \
            src/automatic_lecture_tex/asr.py \
            src/automatic_lecture_tex/board.py \
            src/automatic_lecture_tex/cli.py \
            src/automatic_lecture_tex/config.py \
            src/automatic_lecture_tex/conservative_validation.py \
            src/automatic_lecture_tex/episode_synthesis_resilient.py \
            src/automatic_lecture_tex/formula_detection.py \
            src/automatic_lecture_tex/frame_selection.py \
            src/automatic_lecture_tex/generated_notes.py \
            src/automatic_lecture_tex/gigaam_vad.py \
            src/automatic_lecture_tex/knowledge_integrity.py \
            src/automatic_lecture_tex/knowledge_pipeline_resilient.py \
            src/automatic_lecture_tex/knowledge_reconstruction_resilient.py \
            src/automatic_lecture_tex/latex.py \
            src/automatic_lecture_tex/linear_notes.py \
            src/automatic_lecture_tex/linear_pipeline.py \
            src/automatic_lecture_tex/math_ocr.py \
            src/automatic_lecture_tex/media.py \
            src/automatic_lecture_tex/pipeline_robust.py \
            src/automatic_lecture_tex/schemas.py \
            src/automatic_lecture_tex/sensory_evidence.py \
            src/automatic_lecture_tex/tex_safety.py \
            src/automatic_lecture_tex/unimernet_worker.py \
            src/automatic_lecture_tex/unimumer_worker.py \
            src/automatic_lecture_tex/visual_formula_gate.py \
            tests/test_adaptive_board_sampling.py \
            tests/test_evidence_preservation.py \
            tests/test_formula_detection.py \
            tests/test_generated_notes.py \
            tests/test_integrity_fixes.py \
            tests/test_knowledge_integrity_prompt.py \
            tests/test_knowledge_reconstruction_resilience.py \
            tests/test_linear_config.py \
            tests/test_linear_pipeline.py \
            tests/test_math_ocr.py \
            tests/test_remote_frame_fallback.py \
            tests/test_semantic_reconstruction.py \
            tests/test_sensory_evidence.py \
            tests/test_split_synthesis.py
      - name: Pytest
        run: pytest -q
