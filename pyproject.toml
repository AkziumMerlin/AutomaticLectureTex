[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "automatic-lecture-tex"
version = "0.2.0"
description = "Evidence-driven pipeline for turning recorded lectures into reproducible LaTeX notes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AutomaticLectureTex contributors"}]
dependencies = [
  "numpy>=1.26",
  "openai>=1.60",
  "Pillow>=10.0",
  "pydantic>=2.9",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
qwen-asr = [
  "qwen-asr>=0.0.6,<0.1",
]
qwen-asr-hf = ["accelerate>=1.2", "torch>=2.6", "transformers>=5.13.0"]
whisper = ["faster-whisper>=1.1.0"]
gigaam = ["gigaam @ git+https://github.com/salute-developers/GigaAM.git"]
formula-vision = [
  "torch>=2.10,<2.11",
  "torchvision>=0.25,<0.26",
  "ultralytics>=8.3,<9",
  "huggingface-hub>=0.35,<1",
  "opencv-python>=4.10,<5",
]
latexocr = [
  "torch>=2.10,<2.11",
  "torchvision>=0.25,<0.26",
  "pix2tex==0.1.4",
]
review = ["pymupdf>=1.25"]
dev = ["pytest>=8.3", "ruff>=0.9", "opencv-python>=4.10,<5"]
all = [
  "qwen-asr>=0.0.6,<0.1",
  "faster-whisper>=1.1.0",
  "torch>=2.10,<2.11",
  "torchvision>=0.25,<0.26",
  "pix2tex==0.1.4",
  "pymupdf>=1.25",
]

[project.scripts]
automatic-lecture-tex = "automatic_lecture_tex.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/automatic_lecture_tex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
